[package]
name = "protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# serde derives and TypeScript types for every message, used only by the
# page's test codec (crates/web/tests/codec). The page and tetherd enable
# neither feature.
[features]
serde = []
ts = ["serde", "dep:tsify", "dep:wasm-bindgen"]

[dependencies]
# Losslessly packs the pictures the page sends for a camera. zstd is C, so the
# page's wasm build needs a C compiler for it.
zstd = { version = "0.13", default-features = false }
# Unaligned, so a message can be read in place in the buffer it arrived in.
rkyv = { version = "0.8", features = ["unaligned"] }
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
serde.workspace = true
# `code_proof` proves the setup code is known without sending it.
sha2 = "0.10"
# Tsify's derive writes #[wasm_bindgen] items into this crate. Pinned to the
# page's version, which matches the wasm-bindgen program in the dev shell.
wasm-bindgen = { version = "=0.2.130", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
