[package]
name = "android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
adb.workspace = true
anyhow = "1"
base64 = "0.22"
html-escape = "0.2"
percent-encoding = "2"
roxmltree = "0.20"
rusqlite = { version = "0.43.0", features = ["serialize"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }

# SQLite for the page's wasm build, with host functions from wasm-bindgen.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.6.3", default-features = false, features = ["wasm-bindgen"] }
