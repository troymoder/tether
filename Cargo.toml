[workspace]
resolver = "3"
members = ["crates/*", "crates/web/tests/codec"]
# The page is left out because it only builds for WebAssembly.
default-members = [
    "crates/adb",
    "crates/android",
    "crates/ios",
    "crates/protocol",
    "crates/quicktime",
    "crates/server",
    "crates/vcam-wire",
    "crates/workspace-hack",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unreachable_pub = "deny"

[workspace.lints.clippy]
mod_module_files = "deny"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
adb = { path = "crates/adb" }
android = { path = "crates/android" }
ios = { path = "crates/ios" }
quicktime = { path = "crates/quicktime" }
vcam-wire = { path = "crates/vcam-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Every browser downloads the page, so it is built as small as it can be.
# wasm-opt takes out names and debug info, because `strip` would also remove
# the features section wasm-bindgen needs.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

# A debug build is too slow to move pictures about thirty times a second,
# and a release build is built again in full on each change.
[profile.web-dev]
inherits = "dev"
opt-level = 3
incremental = true
codegen-units = 256
lto = false
debug = "line-tables-only"

# Dependencies are built once, so they are fully optimized.
[profile.web-dev.package."*"]
opt-level = 3
debug = false

[profile.web-dev.package.web-sys]
debug = "line-tables-only"

[profile.web-dev.package.js-sys]
debug = "line-tables-only"

[profile.web-dev.package.wasm-bindgen]
debug = "line-tables-only"
